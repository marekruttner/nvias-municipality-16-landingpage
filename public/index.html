<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <header class="hero">
      <nav class="top-nav">
        <div class="brand">
          <img class="brand-logo" src="assets/img/title_Municipo.svg" alt="Municipality 16+" />
          <span class="brand-text" id="brandText"></span>
        </div>
        <div class="nav-actions">
          <label class="language-selector">
            <span class="sr-only" id="language-label"></span>
            <select id="language-switcher" aria-labelledby="language-label"></select>
          </label>
          <a class="button ghost" id="navParticipationLink" href="https://participationindex.eu" target="_blank" rel="noopener"></a>
        </div>
      </nav>

      <div class="hero-content container">
        <div class="hero-text">
          <p class="hero-eyebrow" id="heroEyebrow"></p>
          <h1 id="heroTitle"></h1>
          <p class="hero-lead" id="heroLead"></p>
          <div class="hero-actions">
            <a class="button" id="heroProjectLink" href="#project"></a>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section class="section" id="project">
        <div class="container">
          <h2 id="projectTitle"></h2>
          <p id="projectText"></p>
        </div>
      </section>

      <section class="section alt" id="solutions">
        <div class="container">
          <div class="section-header">
            <h2 id="solutionsTitle"></h2>
            <p id="solutionsIntro"></p>
          </div>
          <div class="pillars two-columns">
            <article>
              <h3 id="municipoTitle"></h3>
              <p id="municipoText"></p>
              <a class="button small" id="municipoLink" href="https://app.municipality16plus.eu" target="_blank" rel="noopener"></a>
            </article>
            <article>
              <h3 id="indexTitle"></h3>
              <p id="indexText"></p>
              <a class="button small" id="indexLink" href="https://participationindex.eu" target="_blank" rel="noopener"></a>
            </article>
          </div>
        </div>
      </section>

      <section class="section highlight" id="contact">
        <div class="container">
          <div class="cta">
            <div>
              <h2 id="ctaTitle"></h2>
              <p id="ctaText"></p>
            </div>
            <div class="cta-actions">
              <a class="button light" id="ctaContactLink" href="mailto:info@municipio.eu"></a>
            </div>
          </div>

          <div class="partners">
            <article class="partner-card"><h3>PiNA</h3><p id="partnerPina"></p></article>
            <article class="partner-card"><h3>NVIAS</h3><p id="partnerNvias"></p></article>
            <article class="partner-card"><h3>Transparency International Latvia (Delna)</h3><p id="partnerDelna"></p></article>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer-content">
        <div>
          <strong id="footerBrandName"></strong>
          <p id="footerText"></p>
          <p id="footerDisclaimer"></p>
        </div>
        <div class="partner-logos" aria-label="Project partners">
          <span><img src="assets/img/logotip_m16.png" /></span>
        </div>
      </div>
    </footer>

    <script src="assets/js/main.js" type="module"></script>
  </body>
</html>
